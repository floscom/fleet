<body>
<a class="skip" href="#main">Skip to the conversation</a>

<div class="app" id="app" data-screen="list">
  <!-- Sessions: the sidebar on desktops, the home screen on phones. -->
  <nav class="side" id="side" aria-label="Sessions"></nav>
  <div class="side-scrim" id="side-scrim" hidden></div>

  <main class="main" id="main" tabindex="-1"></main>

  <!-- The open session's workflow, files, media and terminal. -->
  <aside class="insp" id="insp" aria-label="Session details" hidden></aside>
</div>

<!-- Menus and bottom sheets are placed here. -->
<div id="layer"></div>

<dialog class="dlg" id="dlg" aria-labelledby="dlg-h"></dialog>

<dialog class="viewer" id="viewer" aria-label="Image" tabindex="-1">
  <img id="viewer-img" alt="">
  <div class="viewer-bar">
    <button type="button" class="icon-btn" id="viewer-prev" aria-label="Newer image"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
    <span id="viewer-cap"></span>
    <button type="button" class="icon-btn" id="viewer-next" aria-label="Older image"><svg class="i" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
    <button type="button" class="icon-btn" id="viewer-close" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
</dialog>

<div class="conn-banner" id="conn" role="status" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
